<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gem Travel Agencies - Explore Egypt</title>
<style>
:root{--primary-color:#0f172a;--accent-color:#0284c7;--danger-color:#dc2626;--bg-color:#f8fafc;--card-bg:#fff;--text-color:#334155}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg-color);color:var(--text-color);margin:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{background:var(--primary-color);color:#fff;width:100%;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 6px rgba(0,0,0,.1);border-bottom:3px solid var(--danger-color)}
.logo-area h1{margin:0;font-size:18px;letter-spacing:1px;text-align:start}
.logo-area p{margin:2px 0 0;font-size:11px;color:#cbd5e1;text-align:start}
.lang-selector select{background:#1e293b;color:#fff;border:1px solid #475569;padding:6px 10px;border-radius:6px;font-size:13px;cursor:pointer;outline:none}
.container{width:100%;max-width:600px;padding:20px 20px 110px;flex:1}
.section-title{font-size:18px;font-weight:bold;margin-bottom:15px;color:var(--primary-color);border-bottom:2px solid #e2e8f0;padding-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:30px}
.main-menu-grid{display:flex;flex-direction:column;gap:15px;margin-top:20px}
.btn-card,.main-btn{background:var(--card-bg);border-radius:12px;text-align:center;font-weight:bold;cursor:pointer;transition:all .3s;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.btn-card{border:2px solid var(--accent-color);padding:20px 15px;font-size:15px;color:var(--accent-color)}
.btn-card:hover{background:var(--accent-color);color:#fff;transform:translateY(-2px)}
.main-btn{border:2px solid var(--danger-color);padding:22px;font-size:17px;color:var(--danger-color)}
.main-btn:hover{background:var(--danger-color);color:#fff;transform:translateY(-2px)}
.info-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 10px rgba(0,0,0,.05);margin-bottom:20px;border-inline-start:5px solid var(--danger-color)}
.info-card h3{margin-top:0;color:var(--primary-color);font-size:19px}
.info-card p{line-height:1.6;color:#475569;font-size:15px}
.back-btn{background:#64748b;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin-bottom:20px;font-size:14px}
.back-btn:hover{background:#475569}
.back-btn::before{content:"← "}
[dir=rtl] .back-btn::before{content:"→ "}
.slideshow-container{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.15);background:#000;direction:ltr}
.mySlides{display:none;text-align:center}
.mySlides.active{display:block}
.mySlides img{width:100%;height:260px;object-fit:cover}
.slide-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:none;font-size:22px;padding:8px 12px;cursor:pointer;z-index:2}
.slide-nav.prev{left:0;border-radius:0 8px 8px 0}
.slide-nav.next{right:0;border-radius:8px 0 0 8px}
.slide-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:10px;z-index:2}
.place-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08);margin-bottom:15px;cursor:pointer}
.place-card img{width:100%;height:150px;object-fit:cover;display:block;background:#e2e8f0}
.place-card div{padding:12px 15px;font-weight:bold;color:var(--primary-color)}
.status{text-align:center;padding:30px 10px;color:#64748b;grid-column:1/-1}
.place-card img.image-unavailable{display:none}
/* زرار الواتساب العايم */
.wa-fab{position:fixed;z-index:900;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:568px;background:#25d366;color:#fff;border:none;border-radius:50px;padding:15px 20px;font-size:15px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px rgba(37,211,102,.45);font-family:inherit}
.wa-fab:hover{background:#20ba5a}
/* نافذة الاختيار */
.modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.5);justify-content:center;align-items:center}
.modal-content{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:400px;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.3)}
.modal-content h3{margin-top:0;color:var(--primary-color)}
.wa-number-option{background:#f1f5f9;border:2px solid #25d366;color:#1e293b;padding:12px;margin:10px 0;border-radius:8px;font-weight:bold;display:block;text-decoration:none;transition:.2s}
.wa-number-option:hover{background:#25d366;color:#fff}
.close-modal{background:#64748b;color:#fff;border:none;padding:8px 15px;border-radius:6px;margin-top:10px;cursor:pointer}
.hidden{display:none}
</style>
</head>

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function getName(obj) {
  if (typeof obj === "string") return obj;
  if (!obj || typeof obj !== "object") return "";
  return obj[lang] || obj.en || obj.ar || obj.sourceLabel || obj.name || "";
}

function setCatalogStatus(message, isError) {
  const status = $("catalog-status");
  if (!status) return;
  status.textContent = message;
  status.classList.toggle("hidden", !message);
  status.style.color = isError ? "#b91c1c" : "";
}

function loadDriveCatalog() {
  if (catalogLoading) return;
  if (!DRIVE_API_URL || DRIVE_API_URL.includes("PASTE_YOUR_")) {
    catalogError = true;
    catalogLoaded = false;
    setCatalogStatus(t("catalogError"), true);
    return;
  }
  catalogLoading = true;
  catalogError = false;
  setCatalogStatus(t("catalogLoading"), false);
  const callbackName = "gemTravelCatalogCallback";
  const oldScript = $("gem-drive-api-script");
  if (oldScript) oldScript.remove();
  if (window.gemTravelCatalogTimeout) clearTimeout(window.gemTravelCatalogTimeout);
  window[callbackName] = function(payload) {
    clearTimeout(window.gemTravelCatalogTimeout);
    catalogLoading = false;
    delete window[callbackName];
    const script = $("gem-drive-api-script");
    if (script) script.remove();
    const records = payload && (Array.isArray(payload.data) ? payload.data : payload.records);
    const apiSucceeded = payload && (payload.success === true || payload.ok === true);
    if (!apiSucceeded || !Array.isArray(records)) {
      catalogError = true;
      catalogLoaded = false;
      setCatalogStatus((payload && payload.error) || t("catalogError"), true);
      if (!$("sightseeing-screen").classList.contains("hidden")) showCatalogError();
      return;
    }
    try {
      tourData = buildCatalog(records);
      catalogLoaded = true;
      catalogError = false;
      if (!$("sightseeing-screen").classList.contains("hidden")) renderDestinations();
    } catch (err) {
      console.error("Catalog processing failed:", err);
      catalogError = true;
      catalogLoaded = false;
      setCatalogStatus(t("catalogError"), true);
    }
  };
  const script = document.createElement("script");
  script.id = "gem-drive-api-script";
  script.async = true;
  script.onerror = function() {
    clearTimeout(window.gemTravelCatalogTimeout);
    catalogLoading = false;
    catalogError = true;
    catalogLoaded = false;
    delete window[callbackName];
    script.remove();
    if (!$("sightseeing-screen").classList.contains("hidden")) showCatalogError();
  };
  script.src = DRIVE_API_URL + (DRIVE_API_URL.includes("?") ? "&" : "?") + "callback=" + callbackName + "&ts=" + Date.now();
  window.gemTravelCatalogTimeout = setTimeout(function() {
    if (catalogLoading) {
      catalogLoading = false;
      catalogError = true;
      catalogLoaded = false;
      delete window[callbackName];
      script.remove();
      if (!$("sightseeing-screen").classList.contains("hidden")) showCatalogError();
    }
  }, DRIVE_API_TIMEOUT_MS);
  document.head.appendChild(script);
}

function normalizeFolderName(value) {
  return String(value || "")
    .normalize("NFKC")
    .trim()
    .toLowerCase()
    .replace(/[._-]+/g, " ")
    .replace(/\s+/g, " ");
}

    "sharm": "sharm el sheikh", "sharm el sheikh": "sharm el sheikh", "sharm elsheikh": "sharm el sheikh",
    "شرم الشيخ": "sharm el sheikh",
    "hurghada": "hurghada", "el hurghada": "hurghada", "الغردقة": "hurghada"
  };

  return aliases[key] || key;
}

function isKnownDestinationSegment(value) {
  const key = canonicalDestinationName(value);
  return ["cairo", "alexandria", "luxor", "aswan", "sharm el sheikh", "hurghada"].includes(key);
}

/* روابط بديلة للصورة: لو الأول فشل بيجرب اللي بعده */
function driveImageUrls(id) {
  const e = encodeURIComponent(id);
  return [
    `https://lh3.googleusercontent.com/d/${e}=w1200`,
    `https://drive.google.com/thumbnail?id=${e}&sz=w1200`,
    `https://drive.google.com/uc?export=view&id=${e}`
  ];
}

function buildCatalog(records) {
  if (!Array.isArray(records)) throw new Error("API records must be an array");

  const destinations = new Map();
  const seenIds = new Set();

  records.forEach(record => {
    if (!record || typeof record.folder !== "string") return;

    const parts = record.folder.split("/").map(x => x.trim()).filter(Boolean);
    const rootIndex = parts.findIndex(x => normalizeFolderName(x) === "gem excursions");
    if (rootIndex < 0 || !parts[rootIndex + 1]) return;

    let destinationIndex = rootIndex + 1;
    if (parts[destinationIndex] && ["egypt", "egypt governorates", "governorates"].includes(normalizeFolderName(parts[destinationIndex]))) {
      destinationIndex++;
    }
    if (!isKnownDestinationSegment(parts[destinationIndex]) && isKnownDestinationSegment(parts[destinationIndex + 1])) {
      destinationIndex++;
    }

    const destinationSource = parts[destinationIndex];
    if (!destinationSource) return;
    const destinationKey = canonicalDestinationName(destinationSource);
    if (!destinationKey || EXCLUDED_DESTINATIONS.includes(destinationKey)) return;

    // لو الصور مباشرة جوه فولدر المحافظة من غير فولدر مكان، نعتبرها مكان باسم المحافظة
    let relativeParts = parts.slice(destinationIndex + 1);
    if (!relativeParts.length) relativeParts = [destinationSource];

    const imageId = typeof record.id === "string" ? record.id : "";
    const urls = imageId
      ? driveImageUrls(imageId)
      : (typeof record.url === "string" && record.url ? [record.url] : []);
    if (!urls.length) return;
    const imageUrl = urls[0];
    const uniqueKey = imageId || imageUrl;
    if (seenIds.has(uniqueKey)) return;
    seenIds.add(uniqueKey);

    if (!destinations.has(destinationKey)) {
      destinations.set(destinationKey, {
        id: destinationKey,
        sourceLabel: destinationKey === "alexandria" ? "Alexandria" : destinationSource,
        name: destinationLabels[destinationKey] || { en: destinationSource, ar: destinationSource },
        places: [],
        categories: new Map(),
        _directPlaces: new Map()
      });
    }

    const dest = destinations.get(destinationKey);
    const placeLabelText = relativeParts[relativeParts.length - 1];
    const placePath = relativeParts.join("/");
    const image = { name: record.name || "", id: imageId, url: imageUrl, urls };

    if (relativeParts.length >= 2) {
      const categoryPath = relativeParts.slice(0, -1).join("/");
      if (!dest.categories.has(categoryPath)) {
        dest.categories.set(categoryPath, {
          name: relativeParts[relativeParts.length - 2],
          sourceLabel: categoryPath,
          places: [],
          _places: new Map()
        });
      }
      const category = dest.categories.get(categoryPath);
      if (!category._places.has(placePath)) {
        category._places.set(placePath, {
          name: placeLabelText,
          sourceLabel: placeLabelText,
          path: placePath,
          images: []
        });
      }
      category._places.get(placePath).images.push(image);
    } else {
      if (!dest._directPlaces.has(placePath)) {
        dest._directPlaces.set(placePath, {
          name: placeLabelText,
          sourceLabel: placeLabelText,
          path: placePath,
          images: []
        });
      }
      dest._directPlaces.get(placePath).images.push(image);
    }
  });

  return Array.from(destinations.values()).map(dest => {
    dest.places = Array.from(dest._directPlaces.values());
    delete dest._directPlaces;
    dest.categories = Array.from(dest.categories.values()).map(category => {
      category.places = Array.from(category._places.values());
      delete category._places;
      return category;
    });
    return dest;
  }).sort((a, b) => getName(a.name).localeCompare(getName(b.name)));
}

function placeLabel(place) {
  return getName(place.labels || place.translations || place.name) || place.sourceLabel || "";
}

function showCatalogError() {
  const grid = $("gov-grid");
  grid.innerHTML = `<div class="status">${esc(t("catalogError"))}<br><button class="back-btn" type="button" onclick="retryCatalog()">${esc(t("retry"))}</button></div>`;
  setCatalogStatus("", true);
}

function retryCatalog() {
  catalogLoading = false;
  loadDriveCatalog();
}

const defaultMsgs = {
  "main-hub-screen": "Hello Gem Travel, I would like more information and general booking.",
  "sightseeing-screen": "Hello Gem Travel, I want to inquire about sightseeing and excursions.",
  "car-rental-screen": "Hello Gem Travel, I want to inquire about Car Rental with Driver.",
  "airport-transfer-screen": "Hello Gem Travel, I want to book an Airport Transfer."
};

function openScreen(id) {
  stopSlides();
  screens.forEach(s => $(s).classList.toggle("hidden", s !== id));
  if (defaultMsgs[id]) waMsg = defaultMsgs[id];
  window.scrollTo(0, 0);
}

function goMainHub() { openScreen("main-hub-screen"); }

function openSightseeing() {
  openScreen("sightseeing-screen");
  if (catalogLoaded) renderDestinations();
  else if (catalogLoading) setCatalogStatus(t("catalogLoading"), false);
  else if (catalogError) showCatalogError();
  else loadDriveCatalog();
}

function renderDestinations() {
  const grid = $("gov-grid");
  grid.innerHTML = "";
  if (!tourData.length) {
    setCatalogStatus(t("catalogEmpty"), false);
    return;
  }
  setCatalogStatus("", false);
  grid.innerHTML = tourData.map((d, i) =>
    `<button class="btn-card" type="button" onclick="openDest(${i})" title="${esc(d.sourceLabel)}">${esc(getName(d.name))}</button>`
  ).join("");
}

function openDest(i) {
  currentDest = tourData[i];
  currentCategory = null;
  if (!currentDest) return;
  openScreen("gov-screen");
  renderDestinationContent();
}

function renderDestinationContent() {
  if (!currentDest) return;
  const title = $("gov-title");
  const content = $("gov-content");
  const back = document.querySelector('#gov-screen [data-t="backDest"]');
  if (currentCategory) {
    title.textContent = `${getName(currentDest.name)} — ${currentCategory.name}`;
    if (back) {
      back.textContent = t("backCategory");
      back.onclick = () => { stopSlides(); currentCategory = null; currentPlace = null; renderDestinationContent(); };
    }
    content.innerHTML = renderPlaceCards(currentCategory.places, tourData.indexOf(currentDest), true);
    waMsg = `Hello Gem Travel, I want to inquire about ${currentCategory.name} in ${currentDest.sourceLabel}.`;
    return;
  }

  title.textContent = getName(currentDest.name);
  if (back) {
    back.textContent = t("backDest");
    back.onclick = openSightseeing;
  }
  const categoryCards = (currentDest.categories || []).map((category, idx) =>
    `<button class="btn-card" type="button" onclick="openCategory(${idx})">${esc(category.name)}</button>`
  ).join("");
  const directCards = renderPlaceCards(currentDest.places || [], tourData.indexOf(currentDest), false);
  content.innerHTML = (categoryCards ? `<div class="grid">${categoryCards}</div>` : "") + directCards;
  if (!content.innerHTML) content.innerHTML = `<div class="status">${esc(t("catalogEmpty"))}</div>`;
  waMsg = `Hello Gem Travel, I want to inquire about excursions in ${currentDest.sourceLabel}.`;
}

function openCategory(index) {
  if (!currentDest || !currentDest.categories || !currentDest.categories[index]) return;
  currentCategory = currentDest.categories[index];
  renderDestinationContent();
}

/* لو الصورة فشلت: جرّب الرابط البديل، ولو خلصت البدائل اخفيها */
function imgError(img, inSlider) {
  let srcs = [];
  try { srcs = JSON.parse(img.dataset.srcs || "[]"); } catch (e) {}
  const next = Number(img.dataset.i || 0) + 1;
  if (next < srcs.length) {
    img.dataset.i = next;
    img.src = srcs[next];
    return;
  }
  if (inSlider) handleSlideImageError(img);
  else img.classList.add("image-unavailable");
}

function renderPlaceCards(places, destIndex, categorized) {
  if (!places || !places.length) return "";
  return places.map((place, idx) => {
    const firstImage = place.images[0];
    const click = categorized
      ? `showDetail(${destIndex}, ${idx}, ${currentDest.categories.indexOf(currentCategory)})`
      : `showDetail(${destIndex}, ${idx}, -1)`;
    return `<div class="place-card" role="button" tabindex="0" onclick="${click}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${click};}">
      ${firstImage ? `<img src="${esc(firstImage.url)}" data-i="0" data-srcs="${esc(JSON.stringify(firstImage.urls))}" alt="${esc(placeLabel(place))}" loading="lazy" referrerpolicy="no-referrer" onerror="imgError(this,false)">` : ""}
      <div title="${esc(place.sourceLabel)}">${esc(placeLabel(place))}</div></div>`;
  }).join("");
}

function backFromDetail() {
  stopSlides();
  if (currentDest) {
    openScreen("gov-screen");
    renderDestinationContent();
  } else {
    openSightseeing();
  }
}

function showDetail(destIdx, placeIdx, categoryIdx) {
  currentDest = tourData[destIdx];
  currentCategory = categoryIdx >= 0 ? (currentDest && currentDest.categories[categoryIdx]) : null;
  currentPlace = currentCategory
    ? currentCategory.places[placeIdx]
    : (currentDest && currentDest.places[placeIdx]);
  if (!currentDest || !currentPlace) return;
  openScreen("detail-screen");
  $("place-title").textContent = placeLabel(currentPlace);
  const imgs = currentPlace.images || [];
  const multi = imgs.length > 1;
  $("slider-container").innerHTML = imgs.length
    ? imgs.map((im, n) => `<div class="mySlides${n === 0 ? " active" : ""}"><img src="${esc(im.url)}" data-i="0" data-srcs="${esc(JSON.stringify(im.urls))}" alt="${esc(im.name)}" referrerpolicy="no-referrer" onerror="imgError(this,true)"></div>`).join("") +
      (multi ? `<button class="slide-nav prev" type="button" aria-label="Previous image" onclick="moveSlide(-1)">❮</button><button class="slide-nav next" type="button" aria-label="Next image" onclick="moveSlide(1)">❯</button><div class="slide-count" id="slide-count">1/${imgs.length}</div>` : "")
    : `<div class="status">${esc(t("noImages"))}</div>`;
  waMsg = `Hello Gem Travel, I want to inquire/book: ${placeLabel(currentPlace)} (${getName(currentDest.name)}).`;
  slideIdx = 0;
  if (multi) slideTimer = setInterval(() => moveSlide(1, true), 4000);
}

function handleSlideImageError(img) {
  const slide = img.closest(".mySlides");
  if (!slide) return;
  const wasActive = slide.classList.contains("active");
  slide.remove();
  const slides = Array.from(document.querySelectorAll(".mySlides"));
  const container = $("slider-container");
  if (!slides.length) {
    stopSlides();
    container.innerHTML = `<div class="status">${esc(t("noImages"))}</div>`;
    return;
  }
  slideIdx = Math.min(slideIdx, slides.length - 1);
  if (wasActive) {
    slides.forEach(s => s.classList.remove("active"));
    slides[slideIdx].classList.add("active");
  }
  updateSlideCount();
  if (slides.length < 2) stopSlides();
}

function updateSlideCount() {
  const slides = document.querySelectorAll(".mySlides");
  const count = $("slide-count");
  if (count) count.textContent = `${slideIdx + 1}/${slides.length}`;
  const multi = slides.length > 1;
  document.querySelectorAll(".slide-nav").forEach(button => button.style.display = multi ? "" : "none");
}

function moveSlide(d, auto) {
  const slides = document.querySelectorAll(".mySlides");
  if (!slides.length) return;
  slides[slideIdx]?.classList.remove("active");
  slideIdx = (slideIdx + d + slides.length) % slides.length;
  slides[slideIdx].classList.add("active");
  updateSlideCount();
  if (!auto && slideTimer) {
    clearInterval(slideTimer);
    slideTimer = setInterval(() => moveSlide(1, true), 4000);
  }
}

function stopSlides() { if (slideTimer) { clearInterval(slideTimer); slideTimer = null; } }

function openWhatsAppModal(text) {
  const box = $("wa-options-container");
  box.innerHTML = "";
  teamContacts.forEach(c => {
    const num = c.number.replace(/\D/g, "").replace(/^00/, "");
    const a = document.createElement("a");
    a.href = `https://wa.me/${num}?text=${encodeURIComponent(text)}`;
    a.target = "_blank";
    a.rel = "noopener";
    a.className = "wa-number-option";
    a.textContent = `🟢 ${c.name}`;
    a.onclick = closeWhatsAppModal;
    box.appendChild(a);
  });
  $("waModal").style.display = "flex";
}

function closeWhatsAppModal() { $("waModal").style.display = "none"; }

function changeLanguage(l) {
  lang = l;
  const root = $("html-root");
  root.lang = l;
  root.dir = l === "ar" ? "rtl" : "ltr";
  $("languageSelect").value = l;

  const map = {
    "header-subtitle": "subtitle", "txt-main-title": "mainTitle", "btn-sightseeing": "sightseeing", "btn-car-rental": "carRental",
    "btn-airport-transfer": "airportTransfer", "fab-text": "fab", "modal-title": "modalTitle", "modal-close-btn": "closeBtn",
    "txt-choose-gov": "chooseGov", "car-title": "carTitle", "car-desc": "carDesc", "airport-title": "airportTitle", "airport-desc": "airportDesc"
  };
  Object.entries(map).forEach(([id, key]) => { if ($(id)) $(id).textContent = t(key); });
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));

  if (!$("sightseeing-screen").classList.contains("hidden")) {
    if (catalogLoaded) renderDestinations();
    else if (catalogLoading) setCatalogStatus(t("catalogLoading"), false);
    else if (catalogError) showCatalogError();
  } else if (!$("gov-screen").classList.contains("hidden") && currentDest) {
    renderDestinationContent();
  } else if (!$("detail-screen").classList.contains("hidden") && currentDest && currentPlace) {
    showDetail(tourData.indexOf(currentDest),
      currentCategory ? currentCategory.places.indexOf(currentPlace) : currentDest.places.indexOf(currentPlace),
      currentCategory ? currentDest.categories.indexOf(currentCategory) : -1);
  }
}

changeLanguage("en");
goMainHub();
loadDriveCatalog();
</script>
